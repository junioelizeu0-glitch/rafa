<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixinha de Joia</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      display: flex;
      background-color: #c75146;
      padding: 40px 20px;
    }

    .jewellery-box {
      position: relative;
      filter: drop-shadow(0 0 30px rgba(0,0,0,0.4));
      margin-top: 140px;
    }

    input#open {
      display: none;
    }

    .diamond-ring {
      position: relative;
    }

    .diamond {
      position: relative;
      border-style: solid;
      border-color: transparent transparent #27c3f3 transparent;
      border-width: 0 5px 5px 5px;
      height: 0;
      width: 15px;
      z-index: 2;
    }
    .diamond:before {
      content: "";
      position: absolute;
      top: 5px;
      left: -5px;
      width: 0;
      height: 0;
      border-style: solid;
      border-color: #27c3f3 transparent transparent transparent;
      border-width: 15px 12.5px 0 12.5px;
    }

    .diamond:after {
      content: "";
      position: absolute;
      border-style: solid;
      border-color: #7fd4f9 transparent transparent transparent;
      border-width: 15px 7px 7px;
      width: 0;
      height: 0;
      left: 0.5px;
      top: 5px;
    }

    .inner {
      position: absolute;
      background-color: #cf7b4a;
      width: 70px;
      height: 15px;
      z-index: 3;
      left: -20px;
      top: 55px;
      border-radius: 20px 20px 0 0;
    }

    .band {
      position: absolute;
      width: 45px;
      height: 45px;
      border: 5px solid #fed53f;
      border-radius: 50%;
      top: 15px;
      left: -15px;
      z-index: 2;
    }

    .band:before, .band:after {
      content: "+";
      position: absolute;
      color: rgba(255,255,255,.5);
    }

      left: 5px;
      top: -15px;
      font-size: 7px;
      text-shadow: 20px -12px;
